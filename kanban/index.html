<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
<title>空焰 · 稿期看板</title>
<link rel="icon" href="ico.png" type="image/png" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved || sys);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css.css" />
</head>
<body>
<div class="app">

  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-left">
      <img src="ico.png" alt="空焰" class="brand-logo" />
      <div class="brand-text">
        <h1>空焰</h1>
        <span class="sub">Commission Schedule</span>
      </div>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="search" type="text" placeholder="搜索名字 / 画师 / QQ…" autocomplete="off" />
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="切换主题">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- 大分类 Tab -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="doing">
      <span class="tab-label">未完成</span>
      <span class="tab-count" id="countDoing">0</span>
    </button>
    <button class="tab-btn" data-tab="done">
      <span class="tab-label">完成</span>
      <span class="tab-count" id="countDone">0</span>
    </button>
    <span class="tab-indicator" id="tabIndicator"></span>
  </nav>

  <!-- 类型筛选 -->
  <div class="filter-bar">
    <div class="filter-group" id="typeFilter"></div>
  </div>

  <main class="board" id="board"></main>

  <div id="empty" class="empty hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>
      <path d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2"></path>
      <path d="M10 12h4"></path>
    </svg>
    <p>没有找到匹配的稿件</p>
  </div>

  <footer class="foot">
    <span>最后更新 · <b id="updated">—</b></span>
  </footer>
</div>

<script src="date.js"></script>
<script>
/* ============ 常量 ============ */
const TYPES = ['全部', '模板', '常稿', '无偿'];
const STATUS_CLS = { '完成': 'done', '未完成': 'doing', '放弃': 'drop' };
const TYPE_CLS   = { '模板': 'tpl', '常稿': 'ord', '无偿': 'free' };

/* ============ 数据 ============ */
const DATA = window.COMMISSION_DATA || { updated: '', items: [] };
if (!Array.isArray(DATA.items)) DATA.items = [];

const state = { tab: 'doing', type: '全部', q: '' };

/* ============ 主题切换 ============ */
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
});

/* ============ 初始化 ============ */
(function init() {
  if (!window.COMMISSION_DATA) return renderError();

  buildTypeFilter();
  initTabs();

  document.getElementById('search').addEventListener('input', (e) => {
    state.q = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('updated').textContent = fmtUpdated(DATA.updated);
  updateTabCounts();
  render();
})();

function renderError() {
  document.querySelector('.tab-bar').style.display = 'none';
  document.querySelector('.filter-bar').style.display = 'none';
  document.getElementById('board').innerHTML = `
    <div class="notice">
      <h3>⚠️ 找不到 date.js</h3>
      <p>请确保 <code>date.js</code> 与 <code>index.html</code> 在同一目录。</p>
      <p>运行 <code>python idea.py</code> 会自动生成该文件。</p>
    </div>`;
}

/* ============ Tab ============ */
function initTabs() {
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.tab === state.tab) return;
      state.tab = btn.dataset.tab;
      tabs.forEach(b => b.classList.toggle('active', b === btn));
      moveIndicator();
      flipPage();
    });
  });
  requestAnimationFrame(() => moveIndicator());
}

function moveIndicator() {
  const active = document.querySelector('.tab-btn.active');
  const indicator = document.getElementById('tabIndicator');
  if (!active || !indicator) return;
  const bar = document.getElementById('tabBar');
  const barRect = bar.getBoundingClientRect();
  const rect = active.getBoundingClientRect();
  indicator.style.left = (rect.left - barRect.left) + 'px';
  indicator.style.width = rect.width + 'px';
}
window.addEventListener('resize', moveIndicator);

function flipPage() {
  const board = document.getElementById('board');
  board.classList.remove('flipping');
  void board.offsetWidth;
  board.classList.add('flipping');
  render();
}

/* ============ 类型筛选 ============ */
function buildTypeFilter() {
  const el = document.getElementById('typeFilter');
  el.innerHTML = TYPES.map(v =>
    `<button class="chip${v === state.type ? ' active' : ''}"
             data-val="${v}">${v}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.type = btn.dataset.val;
      el.querySelectorAll('.chip').forEach(b =>
        b.classList.toggle('active', b === btn));
      render();
    });
  });
}

/* ============ 渲染 ============ */
function render() {
  const board = document.getElementById('board');

  const inTab = DATA.items.filter(it => {
    if (state.tab === 'done') return it.status === '完成';
    return it.status !== '完成';
  });

  const filtered = inTab.filter(it => {
    if (state.type !== '全部' && it.type !== state.type) return false;
    if (state.q) {
      const q = state.q;
      const name   = String(it.name   || '').toLowerCase();
      const artist = String(it.artist || '').toLowerCase();
      const qq     = String(it.qq     || '').toLowerCase();
      if (!name.includes(q) && !artist.includes(q) && !qq.includes(q)) return false;
    }
    return true;
  });

  /* 按日期倒序 */
  filtered.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

  if (filtered.length === 0) {
    board.innerHTML = '';
    document.getElementById('empty').classList.remove('hidden');
    return;
  }
  document.getElementById('empty').classList.add('hidden');

  board.innerHTML = filtered.map(cardHTML).join('');
}

/* ============ Tab 计数 ============ */
function updateTabCounts() {
  const doneCount  = DATA.items.filter(i => i.status === '完成').length;
  const doingCount = DATA.items.length - doneCount;
  document.getElementById('countDoing').textContent = doingCount;
  document.getElementById('countDone').textContent  = doneCount;
}

/* ============ 头像 URL ============ */
function avatarUrl(it) {
  if (it.avatar && String(it.avatar).trim()) return it.avatar;
  if (it.qq && String(it.qq).trim()) {
    return `https://thirdqq.qlogo.cn/g?b=sdk&s=100&nk=${it.qq}`;
  }
  return '';
}

/* ============ 卡片 ============ */
function cardHTML(it) {
  const sc = STATUS_CLS[it.status] || 'doing';
  const tc = TYPE_CLS[it.type]   || 'ord';
  const hasDate   = it.date   && String(it.date).trim();
  const hasArtist = it.artist && String(it.artist).trim();
  const hasQQ     = it.qq     && String(it.qq).trim();
  const aUrl      = avatarUrl(it);

  const avatarHTML = aUrl
    ? `<img class="card-avatar" src="${esc(aUrl)}" alt=""
             referrerpolicy="no-referrer"
             onerror="this.style.display='none'">`
    : '';

  return `
  <article class="card card--${sc}">
    <div class="card-top">
      <div class="card-pills">
        <span class="pill pill--${tc}">${esc(it.type || '—')}</span>
        <span class="pill pill--${sc}">${esc(it.status || '—')}</span>
      </div>
      ${avatarHTML}
    </div>
    <h3 class="card-name">${esc(it.name || '未命名')}</h3>
    <div class="card-meta">
      ${hasArtist ? `
      <span class="artist">
        <svg class="mini-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21v-1a8 8 0 0 1 16 0v1"></path>
        </svg>
        <span>${esc(it.artist)}</span>
      </span>` : ''}
      ${hasDate ? `
      <span class="date">
        <svg class="mini-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <path d="M3 10h18M8 3v4M16 3v4"></path>
        </svg>
        <span>${esc(it.date)}</span>
      </span>` : ''}
      ${hasQQ ? `
      <span class="qq" title="QQ">
        <svg class="mini-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2z"></path>
          <circle cx="9" cy="10" r="1"></circle>
          <circle cx="15" cy="10" r="1"></circle>
        </svg>
        <span>${esc(it.qq)}</span>
      </span>` : ''}
    </div>
  </article>`;
}

/* ============ 工具 ============ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtUpdated(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s).replace('T', ' ').slice(0, 16);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
</script>
</body>
</html>
